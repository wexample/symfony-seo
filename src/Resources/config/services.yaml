services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonySeo\:
        resource: '../../{Controller,EventSubscriber,Service}'

    # Read from a file of the package: what the code says, the same for every
    # request.
    Wexample\PhpSchemaOrg\Class\SchemaOrgVocabulary: ~

    Wexample\SymfonySeo\Normalizer\SchemaOrgNormalizer: ~

    # Just above the serializer's ObjectNormalizer (-1000), below everything
    # describing an object of its own — and not autoconfigured, which would tag
    # it a second time, at 0.
    Wexample\SymfonySeo\Normalizer\SchemaOrgFallbackNormalizer:
        autoconfigure: false
        tags: [{ name: serializer.normalizer, priority: -999 }]

