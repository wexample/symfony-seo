framework:
  test: true
  secret: "test"

wexample_symfony_seo:
  robots:
    sitemaps:
      - 'https://example.com/sitemap.xml'
    extra: 'Crawl-delay: 10'
  sitemap:
    exclude:
      - '^/excluded$'
  redirect_hosts:
    old-docs.example.com:
      to: 'https://example.com'
    moved.example.com:
      to: 'https://example.com/'
      keep_path: true
      permanent: false

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonySeo\Tests\Fixtures\Robots\:
    resource: '../../Robots/'

  Wexample\SymfonySeo\Tests\Fixtures\Sitemap\:
    resource: '../../Sitemap/'

doctrine:
  orm:
    enable_native_lazy_objects: true
